apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-create-malicious-resource-role
  annotations:
    policies.kyverno.io/title: Allowing to create a malicious pod
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.12.0
    kyverno.io/kyverno-version: 1.12.0
    kyverno.io/kubernetes-version: "1.32"
    policies.kyverno.io/subject: Role
    policies.kyverno.io/description: >-
      This policy will check for all the subjects like ServiceAccounts/Users/Groups which are mapped with a Role allowing user to create malicious pods
      (deployment, daemonsets, statefulsets, replicationcontollers, replicasets, jobs, cronjobs) for wildcard apiGroups.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: restrict-create-malicious-resource-roles
      match:
        any:
          - resources:
              kinds:
                - Role
      context:
        - name: rolebinding
          apiCall:
            urlPath: "/apis/rbac.authorization.k8s.io/v1/namespaces/{{ request.object.metadata.namespace }}/rolebindings"
            jmesPath: "items[?roleRef.name=='{{ request.object.metadata.name }}']"
      validate:
        message: >- 
           RoleBinding {{ rolebinding[].metadata.name }} with subjects {{ rolebinding[].subjects[].name }} 
           is using role {{rolebinding[].roleRef.name}} which allows create/update of malicious pods
        deny:
          conditions:
            any:
              - key: "{{ ( contains(to_array(request.object.rules[].verbs[]), 'create') || contains(to_array(request.object.rules[].verbs[]), 'update')) && ( contains(to_array(request.object.rules[].resources[]), 'pods') || contains(to_array(request.object.rules[].resources[]), 'deployments') || contains(to_array(request.object.rules[].resources[]), 'daemonsets') || contains(to_array(request.object.rules[].resources[]), 'statefulsets') || contains(to_array(request.object.rules[].resources[]), 'replicationcontrollers') || contains(to_array(request.object.rules[].resources[]), 'replicasets') || contains(to_array(request.object.rules[].resources[]), 'jobs') || contains(to_array(request.object.rules[].resources[]), 'cronjobs')) && contains(to_array(request.object.rules[].apiGroups[]), '*') }}"
                operator: Equals
                value: true